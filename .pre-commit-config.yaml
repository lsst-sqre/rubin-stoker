# Minimal hygiene checks for the profile's YAML / TOML / Markdown content.
# Kept deliberately light: profile/ ships only the files Rubin customizes
# (everything else is supplied by stoker's builtin default profile via
# per-file fallback — see AGENTS.md), so these hooks just gate the small
# Rubin-owned surface.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
